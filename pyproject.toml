[project]
name = "rsi-lecture-suite"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.6"]

[project.scripts]
rsi-lab = "rsi_lab.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["rsi_lab*"]
